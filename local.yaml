# Publishes the lab on your own machine only (127.0.0.1), for running it outside the platform:
#   docker compose -f compose.yaml -f local.yaml up
# then use a broker client on 127.0.0.1 port 1883. Nothing here asks for a password, so keep it on 127.0.0.1.
services:
  broker:
    ports: ["127.0.0.1:1883:1883"]
